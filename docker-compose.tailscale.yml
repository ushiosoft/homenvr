# Optional overlay: expose homenvr on your private Tailscale network (tailnet),
# so you can watch from anywhere with no ports forwarded and no Hik cloud.
#
# One-time setup:
#   1. Make a Tailscale account (free) and generate an auth key:
#      https://login.tailscale.com/admin/settings/keys  (reusable, ephemeral off)
#   2. Put it in .env:   TS_AUTHKEY=tskey-auth-xxxxx
#   3. Start with the overlay:
#      docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#   4. Open https://homenvr.<your-tailnet>.ts.net from any device on your tailnet.
#
# The sidecar proxies the tailnet to homenvr over the internal docker network;
# your LAN access on :8971 keeps working unchanged.
services:
  tailscale:
    image: tailscale/tailscale:v1.80.3
    container_name: homenvr-tailscale
    hostname: homenvr
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/ts-serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./ts-serve.json:/config/ts-serve.json:ro
    depends_on:
      - homenvr
    restart: unless-stopped
volumes:
  ts-state:
