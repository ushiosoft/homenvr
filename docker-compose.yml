services:
  homenvr:
    build: .
    image: homenvr:latest
    container_name: homenvr
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "8971:8080"
    volumes:
      - ./config.yml:/config/config.yml:ro
      - ${RECORDINGS_DIR:-./recordings}:/recordings
    tmpfs:
      - /tmp/homenvr-live:size=256m   # live-view HLS segments; RAM only
