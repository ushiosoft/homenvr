# go2rtc sidecar: low-latency WebRTC live view for homenvr (see app/webrtc.py).
# Streams are NOT listed here: homenvr registers them at runtime from its own camera
# config, so this file holds no credentials and is mounted read-only.
api:
  listen: ":1984"        # internal only (not published); homenvr proxies signalling
rtsp:
  listen: ":8554"        # internal only (not published): go2rtc's ffmpeg transcoder
                         # hands video back through it
webrtc:
  listen: ":8555"        # published on the host (tcp + udp) for the media
  # Addresses the browser can reach go2rtc at (it otherwise only knows its container
  # IP). Set in .env: the host's LAN IP, and the Tailscale sidecar's tailnet IP.
  candidates:
    - ${WEBRTC_LAN_IP:127.0.0.1}:8555
    - ${WEBRTC_TS_IP:127.0.0.1}:8555
  # No public STUN servers: LAN and Tailscale need none, and by default go2rtc would
  # contact Google's to learn (and advertise) this home's public IP.
  ice_servers: []
# H.265 sub-streams are converted with a keyframe every second (go2rtc's default is
# every 50 frames, ~5 s at 10 fps): homenvr's live HLS copies this output into 1 s
# segments, and each segment must start on a keyframe.
ffmpeg:
  h264: "-c:v libx264 -preset:v superfast -tune:v zerolatency -profile:v high -level:v 4.1 -pix_fmt:v yuv420p -force_key_frames expr:gte(t,n_forced*1)"
log:
  level: info
