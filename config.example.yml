# homenvr configuration. ${VAR} values come from .env.
nvr:
  host: 192.168.1.64
  port: 554
  username: admin
  password: ${NVR_PASSWORD}

cameras:            # channel = NVR channel number (D1, D2, D3...)
  # Your cameras: main = HEVC 2560x1440, sub = HEVC 640x360, audio = G.711.
  # Sub streams are H.265, which browsers can't play, so live_codec: h264
  # transcodes the small 640x360 preview (cheap). Recording keeps original HEVC.
  - {id: cam1, name: Camera 1, channel: 1, live_codec: h264}   # per-camera: rotation (0/90/180/270), motion_sensitivity (0=global), audio, enabled
  - {id: cam2, name: Camera 2, channel: 2, live_codec: h264}
  - {id: cam3, name: Camera 3, channel: 3, live_codec: h264}
  # Options per camera:
  #   live_codec: h264   transcode live view if your browser can't play H.265
  #   audio: none|aac|copy
  #   record_url / live_url: full rtsp:// URLs to bypass the NVR (e.g. camera moved to home WiFi)

segment_seconds: 600   # 10-minute files

retention:
  max_days: 60         # delete footage older than this (0 = never)
  max_gb: 0            # cap total size (0 = no cap)
  min_free_gb: 20      # always keep this much disk free

ui:
  username: admin
  password: ${UI_PASSWORD}

motion:                # server-side motion detection -> timeline markers (no NVR changes)
  enabled: true
  sensitivity: 4.0     # frame-difference brightness threshold (0-255); lower = more sensitive
  min_gap_seconds: 8   # merge a burst of motion into one event
  detect: true         # label events person/vehicle (on-server object detection)
  detect_confidence: 0.45

alerts:                # notify when a camera stops recording / disk fills
  notifier: none       # none | ntfy | webhook | smtp
  # ntfy_url: https://ntfy.sh/your-private-topic   # for notifier: ntfy
  # webhook_url: https://discord.com/api/webhooks/...  # notifier: webhook (Discord/Slack)
  # telegram: {bot_token: "123:ABC", chat_id: "123456789"}  # notifier: telegram
  # smtp: {host: smtp.example.com, port: 587, user: you, password: pw, to: you@example.com}
  stale_segment_seconds: 180   # alert if recording but no new data this long
  motion_push: false           # push a camera snapshot when motion is detected
  motion_push_cooldown: 0      # seconds between motion pushes per camera (0 = every event)

# Low-latency WebRTC live view via the go2rtc sidecar (docker-compose.yml).
# Remove or leave empty to use HLS only.
webrtc_api: http://go2rtc:1984
