# homenvr configuration. ${VAR} values come from .env.
# Most of the alerts / motion / retention / auto-save settings, camera names and
# rotation, and ignore zones can also be changed on the Settings page; those
# changes are kept in settings.json next to the recordings and win over this file.

nvr:                  # the RTSP source the cameras are reachable through
  host: 192.168.1.64
  port: 554
  username: admin
  password: ${NVR_PASSWORD}

cameras:              # one entry per camera, as many as you have (at least one)
  - {id: cam1, name: Front door, channel: 1}
  - {id: cam2, name: Driveway, channel: 2}
  - {id: cam3, name: Backyard, channel: 3}
  # - {id: cam4, name: Garage, channel: 4}    # add or remove lines freely
  #
  # Per camera (all optional):
  #   channel: N           NVR channel (D1, D2...); streams are /Streaming/Channels/N01 (main), N02 (sub)
  #   live_codec: copy     "h264" transcodes the live view if the sub-stream is H.265 (browsers can't
  #                        play it); "copy" passes an H.264 sub-stream through (no CPU)
  #   audio: aac           aac | copy | none  (G.711 camera audio needs aac to fit in MP4)
  #   rotation: 0          0 / 90 / 180 / 270, e.g. a camera mounted sideways
  #   motion_sensitivity: 0   per-camera override of motion.sensitivity (0 = use the global one)
  #   push_on: ""          per-camera override of alerts.push_on ("" = use the global one)
  #   enabled: true
  #   record_url / live_url: full rtsp:// URLs instead of the NVR (e.g. a standalone IP camera)

segment_seconds: 600  # length of each recording file (10 minutes)
rtsp_transport: tcp   # tcp (reliable over Wi-Fi) or udp

retention:            # footage past either limit moves to a grace area first
  max_days: 30        # 0 = no age limit
  max_gb: 0           # total size cap, 0 = none
  min_free_gb: 20     # grace footage is deleted only when free disk drops below this

ui:
  username: admin
  password: ${UI_PASSWORD}

motion:               # server-side motion detection on the sub-streams (no NVR changes)
  enabled: true
  sensitivity: 1.0    # % of the picture that must clearly change for 0.4 s; lower = more sensitive
  min_gap_seconds: 8  # merge a burst of motion into one event
  detect: true        # label events person / vehicle / animal (on-server object detection)
  detect_confidence: 0.45

alerts:
  notifier: none      # none | ntfy | webhook | telegram | smtp
  # ntfy_url: https://ntfy.sh/your-private-topic
  # webhook_url: https://discord.com/api/webhooks/...      # Discord / Slack
  # telegram: {bot_token: "123456:ABC...", chat_id: "123456789"}   # message the bot first
  # smtp: {host: smtp.example.com, port: 587, user: you, password: pw, to: you@example.com}
  stale_segment_seconds: 180   # health alert: recording but no new data this long
  check_interval: 60           # seconds between health checks
  memory_alert_mb: 1500        # health alert: homenvr itself uses more memory than this (0 = off)
  motion_push: false           # push a snapshot when motion is detected
  push_on: person              # which events push: person | person_vehicle | person,animal |
                               #   person,vehicle,animal | motion (every event)
  motion_push_cooldown: 0      # seconds between motion pushes per camera (0 = every event)
  # public_url: https://homenvr.your-tailnet.ts.net   # pushes then link to the event

autosave:             # clips of pushed events, kept under Saved with their own limits
  enabled: true
  before: 10          # seconds before the event
  after: 30           # seconds after the last push of the incident
  max_days: 90        # 0 = no limit
  max_gb: 50          # 0 = no limit

# Low-latency WebRTC live view via the go2rtc sidecar (docker-compose.yml).
# Leave empty to use HLS only.
webrtc_api: http://go2rtc:1984
