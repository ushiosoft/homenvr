<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>homenvr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1115; --panel:#13161b; --panel2:#171a20; --raised:#1d2128; --line:#262b33; --line2:#2a2f38;
    --fg:#e6e8eb; --muted:#9aa3b2; --dim:#7c8594; --accent:#60a5fa; --accent-ink:#0b1220;
    --motion:#94a3b8; --person:#4ade80; --vehicle:#fbbf24; --head:#f87171; --live:#b91c1c;
    --warn-bg:#1a1710; --warn-line:#4a3f22; --warn:#fcd34d; --warn-text:#c7b98a;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --lane-label:156px; --lane-gap:12px; --lane-h:68px;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg); }
  body { font:14px/1.4 'IBM Plex Sans', system-ui, sans-serif; }
  button, select, input { font:inherit; color:inherit; }
  a { color:#93c5fd; }
  .hidden { display:none !important; }
  img.broken { visibility:hidden; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* ---- header ---- */
  header.top { display:flex; align-items:center; gap:28px; padding:0 32px; min-height:56px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header.top .brand { font-weight:600; font-size:16px; letter-spacing:.2px; }
  nav.main { display:flex; gap:4px; }
  nav.main a { color:var(--muted); text-decoration:none; padding:8px 12px; border-radius:6px; display:flex; align-items:center; gap:6px; }
  nav.main a.on { color:var(--fg); background:#1f242c; }
  nav.main svg { display:none; }
  .walllink { margin-left:auto; color:var(--muted); font-size:12px; text-decoration:none; border:1px solid var(--line2); padding:6px 10px; border-radius:6px; }
  #usage { color:var(--muted); font-size:12px; }

  .page { max-width:1440px; margin:0 auto; padding:20px 32px 32px; display:flex; flex-direction:column; gap:20px; }

  /* ---- buttons ---- */
  .btn { height:40px; padding:0 14px; border:1px solid var(--line2); background:var(--raised); border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; text-decoration:none; color:var(--fg); }
  .btn:hover { border-color:#3a414c; }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.big { height:44px; }
  .btn.keep { border-color:#3b4a63; background:#1c2635; color:#bfdbfe; }
  .btn.golive { background:var(--live); border:0; color:#fff; font-weight:600; }
  .btn.golive::before, .livepill .d { content:''; width:8px; height:8px; border-radius:50%; background:#fff; }
  .btn.warn { border-color:#6b5a2a; background:#2a2414; color:#fde68a; height:36px; padding:0 12px; }
  .btn.warn.ghost { border-color:#3a3424; background:transparent; color:var(--warn-text); }
  .ibtn { width:44px; height:44px; border:0; background:transparent; border-radius:8px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; color:var(--fg); }
  .ibtn:hover { background:var(--raised); }
  .playbtn { width:48px; height:48px; border:0; background:var(--accent); color:var(--accent-ink); border-radius:50%; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  /* ---- toolbar ---- */
  .toolbar { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .livepill { display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; border-radius:8px; background:#2a1416; border:1px solid #7f2a2f; color:#fecaca; font-weight:600; }
  .livepill .d { background:var(--head); width:9px; height:9px; box-shadow:0 0 0 4px rgba(248,113,113,.2); }
  .livepill .mono { font-weight:500; color:#fca5a5; }
  .revpill { display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; border-radius:8px; background:var(--panel2); border:1px solid var(--line2); }
  .revpill .lbl, .revpill .day { color:var(--muted); }
  .revpill .mono { font-weight:500; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; }
  .filters button { height:40px; padding:0 14px; border-radius:999px; cursor:pointer; background:var(--panel2); border:1px solid var(--line2); color:var(--muted); }
  .filters button.on { background:#1c2635; border-color:var(--accent); color:var(--fg); }
  .filters .n { font-family:var(--mono); font-size:12px; opacity:.75; margin-left:6px; }
  .seg { display:flex; background:var(--panel2); border:1px solid var(--line2); border-radius:8px; padding:4px; gap:4px; }
  .seg button { padding:0 14px; height:34px; border:0; border-radius:6px; cursor:pointer; background:transparent; color:var(--muted); }
  .seg button.on { background:#262c36; color:var(--fg); font-weight:500; }
  .toolbar .seg.layout { margin-left:auto; }

  /* ---- main row ---- */
  .mainrow { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  .gridcol { flex:999 1 820px; min-width:0; display:flex; flex-direction:column; gap:12px; }

  /* ---- camera grid ---- */
  .camgrid { display:grid; gap:8px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); }
  .tile { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:16/9; min-height:0; outline:2px solid transparent; outline-offset:-2px; }
  .tile.portrait { aspect-ratio:9/16; }
  .camgrid.mix .tile.portrait { grid-row:span 2; aspect-ratio:auto; }
  .tile.sel { outline-color:rgba(96,165,250,.55); }
  .tile video { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:contain; display:block; transform-origin:center center; will-change:transform; background:#000; }
  .tile.zoomed video { cursor:grab; touch-action:none; }
  .tile .name { position:absolute; left:10px; top:10px; background:rgba(10,12,15,.72); padding:4px 9px; border-radius:6px; font-size:12px; font-weight:500; z-index:2; pointer-events:none; }
  .tile .badge { position:absolute; right:10px; top:10px; padding:4px 9px; border-radius:6px; font-size:11px; font-weight:600; font-family:var(--mono); z-index:2; background:rgba(10,12,15,.72); pointer-events:none; }
  .tile .badge.live { background:var(--live); color:#fff; }
  .tile .over { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:10px; z-index:1; color:#c7cdd6; font-size:13px; background:rgba(0,0,0,.45); pointer-events:none; text-align:center; padding:12px; }
  .tile .ctls { position:absolute; right:8px; bottom:8px; display:flex; gap:4px; z-index:3; opacity:0; transition:opacity .15s; }
  .tile:hover .ctls, .tile:focus-within .ctls { opacity:1; }
  .tile .side { display:none; }
  .iconbtn { background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:6px; width:32px; height:32px; font-size:15px; cursor:pointer; line-height:1; display:inline-flex; align-items:center; justify-content:center; }
  .iconbtn:hover { background:rgba(0,0,0,.85); }
  .playtap { position:absolute; inset:0; margin:auto; width:140px; height:40px; background:rgba(0,0,0,.7); color:#fff; border:0; border-radius:8px; cursor:pointer; z-index:4; }
  @media (hover:none) { .tile .ctls { opacity:1; } .iconbtn { width:36px; height:36px; } }
  .spin { width:22px; height:22px; border:2px solid #3a414c; border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .spin, .spinner { animation-duration:2s; } }

  /* Focus layout: the selected camera large, the others small beside it (same videos). */
  .camgrid.focus { grid-template-columns:minmax(0,1fr) 300px; grid-auto-rows:min-content; }
  .camgrid.focus .tile { grid-row:auto; }
  .camgrid.focus .tile.sel { grid-column:1; aspect-ratio:16/9; border-radius:12px; align-self:start; }
  .camgrid.focus .tile:not(.sel) { grid-column:2; aspect-ratio:16/9; cursor:pointer; }
  .camgrid.focus .tile:not(.sel) .ctls { display:none; }
  .camgrid.focus .tile:not(.sel) .side { display:block; position:absolute; left:0; right:0; bottom:0; padding:18px 10px 8px; font-size:12px; color:#c7cdd6; background:linear-gradient(transparent, rgba(0,0,0,.8)); z-index:2; pointer-events:none; }
  .camgrid.focus .tile:not(.sel) .side b { color:#93c5fd; font-weight:500; float:right; }

  /* ---- transport ---- */
  .transport { display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line2); border-radius:10px; padding:6px 10px; flex-wrap:wrap; min-height:56px; }
  .transport .hint { color:var(--muted); font-size:12px; margin-left:8px; flex:1 1 240px; }
  .transport .time { font-family:var(--mono); font-size:18px; font-weight:500; margin-left:10px; }
  .transport .right { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  /* Review progress bar: the current incident ±10 s, else a 5-minute block. */
  .scrub { flex:1 1 100%; order:10; display:flex; align-items:center; gap:10px; padding:2px 6px 6px; }
  .scrub .st { font-size:11px; color:var(--dim); flex:none; }
  .scrub .bar { position:relative; flex:1; height:28px; cursor:pointer; touch-action:none; }
  .scrub .bar::before { content:''; position:absolute; left:0; right:0; top:12px; height:4px; border-radius:2px; background:#2a303a; }
  .scrub .incwin { position:absolute; top:8px; height:12px; background:rgba(96,165,250,.14); border-radius:3px; }
  .scrub .fill { position:absolute; left:0; top:12px; height:4px; border-radius:2px; background:var(--accent); }
  .scrub .knob { position:absolute; top:7px; width:14px; height:14px; margin-left:-7px; border-radius:50%; background:#fff; box-shadow:0 0 0 3px rgba(96,165,250,.35); }
  .scrub .ticks span { position:absolute; top:6px; width:2px; height:16px; margin-left:-1px; background:var(--motion); opacity:.8; }
  .scrub .ticks span.person { background:var(--person); } .scrub .ticks span.vehicle { background:var(--vehicle); }
  .scrub .lbl { position:absolute; bottom:28px; transform:translateX(-50%); background:var(--head); color:#1a0b0b; font-family:var(--mono); font-size:11px; font-weight:600; padding:1px 6px; border-radius:4px; white-space:nowrap; }
  .syncchip { display:flex; align-items:center; gap:6px; margin-left:10px; padding:5px 10px; border-radius:999px; background:#1d2a1f; color:#86efac; font-size:12px; }
  .syncchip::before { content:''; width:7px; height:7px; border-radius:50%; background:var(--person); }
  .syncchip.wait { background:#2a2414; color:#fde68a; } .syncchip.wait::before { background:var(--vehicle); }
  .chk { display:flex; align-items:center; gap:6px; color:#c7cdd6; font-size:13px; cursor:pointer; white-space:nowrap; }
  .chk input { accent-color:var(--accent); width:16px; height:16px; }
  .sel-lbl { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; }
  select { background:var(--raised); color:var(--fg); border:1px solid var(--line2); border-radius:6px; padding:6px 8px; }

  /* ---- incidents ---- */
  aside.incidents { flex:1 1 380px; min-width:300px; background:var(--panel); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; max-height:720px; }
  .inc-head { padding:14px 16px 10px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:8px; }
  h2 { margin:0; font-size:15px; font-weight:600; }
  .sub { color:var(--muted); font-size:12px; }
  .inc-list { overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
  .watching { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; background:#1a1314; border:1px solid #3d2326; font-size:13px; color:#fecaca; }
  .watching::before { content:''; flex:none; width:8px; height:8px; border-radius:50%; background:var(--head); box-shadow:0 0 0 4px rgba(248,113,113,.18); }
  .icard { text-align:left; width:100%; padding:12px; border-radius:10px; cursor:pointer; display:flex; flex-direction:column; border:1px solid var(--line); background:var(--panel2); }
  .icard:hover { border-color:#3a414c; }
  .icard.on { border-color:var(--accent); background:#18212e; box-shadow:inset 3px 0 0 var(--accent); }
  .icard.noise { opacity:.72; }
  .icard .row1 { display:flex; align-items:center; gap:8px; width:100%; }
  .icard .t { font-family:var(--mono); font-size:14px; font-weight:500; white-space:nowrap; }
  .icard .dur { color:var(--muted); font-size:12px; }
  .icard .tend { color:var(--muted); font-weight:400; }
  .icard .thumbs { display:flex; gap:4px; margin:8px 0 6px; height:58px; overflow:hidden; }
  .icard .thumbs img { height:58px; width:auto; min-width:32px; border-radius:5px; display:block; background:#0b0d10; }
  .icard .row3 { display:flex; gap:6px; color:var(--muted); font-size:12px; width:100%; }
  .icard .row3 .mono { margin-left:auto; }
  .chip { font-size:11px; padding:2px 8px; border-radius:999px; white-space:nowrap; background:#252b34; color:#cbd5e1; }
  .chip.person { background:rgba(74,222,128,.16); color:var(--person); }
  .chip.vehicle { background:rgba(251,191,36,.16); color:var(--vehicle); }
  .chip.playing { background:var(--accent); color:var(--accent-ink); font-weight:600; }
  .chip.noise { background:transparent; border:1px dashed #4a3f22; color:var(--warn-text); }
  .icard .row1 .chip.kind { margin-left:auto; }
  .busy { border:1px dashed var(--warn-line); background:var(--warn-bg); border-radius:10px; padding:12px; }
  .busy .ttl { font-weight:600; color:var(--warn); }
  .busy .rng { margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--warn-text); }
  .busy p { margin:0 0 10px; color:var(--warn-text); font-size:12px; }
  .busy .thumbs { display:flex; gap:4px; margin:8px 0; }
  .busy .thumbs img { height:52px; width:auto; min-width:30px; border-radius:5px; background:#0b0d10; }
  .busy .acts { display:flex; gap:8px; flex-wrap:wrap; }
  .busy .bursts { display:flex; flex-direction:column; gap:4px; margin-top:10px; max-height:260px; overflow:auto; }
  .busy .bursts button { display:flex; gap:8px; align-items:center; text-align:left; padding:4px 8px; border:1px solid #3a3424; background:transparent; border-radius:6px; cursor:pointer; color:var(--warn-text); font-size:12px; }
  .tuner { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; color:var(--warn-text); font-size:12px; }
  .tuner input[type=range] { flex:1; min-width:120px; accent-color:var(--warn); }
  .note { margin:4px 4px 0; color:var(--dim); font-size:12px; }

  /* ---- timeline ---- */
  section.timeline { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px 16px; }
  .tl-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .tl-head .seg { padding:3px; gap:3px; }
  .daynav { display:flex; align-items:center; gap:2px; }
  .daynav .ibtn { width:36px; height:36px; }
  .daynav .lbl { min-width:100px; text-align:center; font-weight:500; }
  .legend { margin-left:auto; display:flex; gap:14px; align-items:center; color:var(--muted); font-size:12px; flex-wrap:wrap; }
  .legend span { display:flex; align-items:center; gap:6px; }
  .legend i { display:inline-block; width:4px; height:12px; border-radius:1px; }
  .tl-axis { position:relative; height:18px; margin-left:calc(var(--lane-label) + var(--lane-gap)); color:var(--dim); font-family:var(--mono); font-size:11px; }
  .tl-axis span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
  .tl-axis span:first-child { transform:none; } .tl-axis span:last-child { transform:translateX(-100%); }
  .tl-body { position:relative; display:flex; flex-direction:column; gap:8px; margin-top:4px; }
  .lane { display:flex; align-items:stretch; gap:var(--lane-gap); height:var(--lane-h); }
  .lane .lab { width:var(--lane-label); flex:none; display:flex; align-items:center; gap:10px; border:0; background:transparent; padding:0; text-align:left; cursor:pointer; color:var(--fg); }
  .lane .lab .noimg { width:48px; height:48px; border-radius:6px; background:var(--panel2); flex:none; }
  .lane .lab img { width:48px; height:48px; object-fit:cover; border-radius:6px; display:block; background:var(--panel2); flex:none; }
  .lane .lab .nm { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .lane .lab .nm b { font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lane .lab .nm span { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .lane .lab .nm span.noisy { color:var(--warn); }
  .lane.sel .lab .nm b { color:#93c5fd; }
  .track { position:relative; flex:1; background:var(--panel2); border-radius:6px; overflow:hidden; }
  .track .bars { position:absolute; inset:6px 0 9px 0; display:flex; align-items:flex-end; gap:1px; }
  .track .bars div { flex:1; background:var(--motion); border-radius:1px 1px 0 0; opacity:.85; }
  .track .bars div.person { background:var(--person); } .track .bars div.vehicle { background:var(--vehicle); }
  .track .cov { position:absolute; bottom:0; height:5px; background:#3b4a63; }
  .track .future { position:absolute; top:0; bottom:0; right:0; background:repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 6px, transparent 6px 12px); }
  .track .busyband { position:absolute; bottom:5px; height:4px; background:repeating-linear-gradient(90deg, rgba(252,211,77,.7) 0 2px, transparent 2px 5px); }
  .track .strip { position:absolute; inset:0; display:flex; gap:2px; }
  .track .strip img { flex:1; min-width:0; height:100%; object-fit:cover; display:block; opacity:.9; background:#0b0d10; }
  .track .strip .gap { flex:1; background:repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 6px, transparent 6px 12px); }
  .track .mk { position:absolute; top:0; bottom:0; width:3px; margin-left:-1px; background:var(--motion); }
  .track .mk.person { background:var(--person); } .track .mk.vehicle { background:var(--vehicle); }
  .track .tick { position:absolute; top:0; height:8px; width:2px; margin-left:-1px; }
  .track .tick.person { background:var(--person); } .track .tick.vehicle { background:var(--vehicle); }
  .tl-over { position:absolute; top:-6px; bottom:-4px; left:calc(var(--lane-label) + var(--lane-gap)); right:0; cursor:pointer; touch-action:none; z-index:2; }
  .tl-over .band { position:absolute; top:6px; bottom:4px; background:rgba(96,165,250,.2); border-left:2px solid var(--accent); border-right:2px solid var(--accent); pointer-events:none; }
  .playhead { position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--head); pointer-events:none; }
  .playhead span { position:absolute; top:-18px; left:50%; transform:translateX(-50%); background:var(--head); color:#1a0b0b; font-family:var(--mono); font-size:11px; font-weight:600; padding:1px 6px; border-radius:4px; white-space:nowrap; }
  .tl-hint { margin:10px 0 0 calc(var(--lane-label) + var(--lane-gap)); color:var(--dim); font-size:12px; }

  /* ---- focus panel (incident in depth) ---- */
  .focuspanel { display:flex; flex-direction:column; gap:16px; }
  .fp-head { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .fp-head h1 { margin:0; font-size:18px; font-weight:600; }
  .fp-head .acts { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .fp-row { display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .fp-win { flex:999 1 600px; min-width:0; }
  .minitl { position:relative; height:40px; background:var(--panel2); border-radius:6px; margin-top:8px; cursor:pointer; touch-action:none; }
  .minitl .tk { position:absolute; top:6px; bottom:6px; width:4px; margin-left:-2px; border-radius:2px; background:var(--motion); }
  .minitl .tk.on { background:var(--accent); } .minitl .tk.person { background:var(--person); } .minitl .tk.vehicle { background:var(--vehicle); }
  .minitl .incwin { position:absolute; top:0; bottom:0; background:rgba(96,165,250,.12); border-left:1px dashed #3b4a63; border-right:1px dashed #3b4a63; }
  .minitl .ph { position:absolute; top:-4px; bottom:-4px; width:2px; margin-left:-1px; background:var(--head); pointer-events:none; }
  .miniaxis { position:relative; height:16px; margin-top:4px; color:var(--dim); font-family:var(--mono); font-size:11px; }
  .miniaxis span { position:absolute; transform:translateX(-50%); } .miniaxis span:first-child { transform:none; } .miniaxis span:last-child { transform:translateX(-100%); }
  .noisehint { flex:1 1 300px; min-width:260px; border:1px dashed var(--warn-line); background:var(--warn-bg); border-radius:10px; padding:12px; }
  .noisehint .ttl { font-weight:600; color:var(--warn); margin-bottom:6px; }
  .noisehint p { margin:0 0 10px; color:var(--warn-text); font-size:12px; }
  .seq { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  .seqcard { flex:none; width:168px; text-align:left; padding:8px; border-radius:10px; cursor:pointer; display:flex; flex-direction:column; border:1px solid var(--line); background:var(--panel2); }
  .seqcard.on { border-color:var(--accent); background:#18212e; }
  .seqcard .im { position:relative; display:block; }
  .seqcard img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; border-radius:6px; background:#0b0d10; }
  .seqcard .no { position:absolute; left:6px; top:6px; width:22px; height:22px; border-radius:50%; background:rgba(10,12,15,.8); font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; }
  .seqcard .r { display:flex; justify-content:space-between; margin-top:6px; width:100%; font-size:12px; color:var(--muted); }
  .seqcard .r .mono { font-size:13px; color:var(--fg); }
  .strength { position:relative; display:block; width:100%; height:6px; margin-top:6px; background:#252b34; border-radius:3px; }
  .strength i { position:absolute; left:0; top:0; bottom:0; background:var(--motion); border-radius:3px; }
  .strength b { position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--warn); }
  .seqcard .cap { font-size:11px; color:var(--muted); margin-top:4px; }

  /* ---- saved / settings ---- */
  .scard { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; max-width:720px; }
  .scard h3 { margin:0 0 4px; font-size:15px; }
  p.hint, .scard p.hint { margin:0 0 12px; color:var(--muted); font-size:12px; }
  .frow { display:flex; gap:10px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .frow > label:first-child { width:170px; color:var(--muted); }
  .frow input:not([type=checkbox]):not([type=range]), .frow select { flex:1; min-width:140px; padding:8px; border:1px solid var(--line2); border-radius:6px; background:var(--panel2); color:var(--fg); }
  .frow .btn { height:36px; }
  .saved { color:var(--person); font-size:12px; margin-left:8px; }
  input[type=range] { accent-color:var(--accent); flex:1; min-width:120px; }
  .rangeval { min-width:44px; text-align:right; font-family:var(--mono); color:var(--fg); }
  .rangehint { display:flex; justify-content:space-between; color:var(--muted); font-size:11px; margin:-2px 0 6px 180px; }
  .btn.on { border-color:var(--accent); background:#1c2635; color:#bfdbfe; }
  .iconbtn.snd.on { background:var(--accent); color:var(--accent-ink); }
  .tile .sndbadge { position:absolute; left:10px; bottom:10px; z-index:2; background:var(--accent); color:var(--accent-ink); border-radius:6px; padding:3px 6px; display:none; pointer-events:none; }
  .tile.audible .sndbadge { display:flex; }
  .savedgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .scard.clip { margin:0; padding:0; overflow:hidden; display:flex; flex-direction:column; max-width:none; }
  .clip .thumb { position:relative; border:0; padding:0; background:#000; cursor:pointer; display:block; aspect-ratio:16/9; }
  .clip .thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .clip .thumb .play { position:absolute; inset:0; margin:auto; width:52px; height:52px; border-radius:50%; background:rgba(10,12,15,.7); color:#fff; display:flex; align-items:center; justify-content:center; }
  .clip .meta { padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; }
  .clip .meta b { font-weight:500; word-break:break-all; }
  .clip .acts { display:flex; gap:8px; }
  .clip .acts .btn { height:36px; }
  #modal video { max-width:min(92vw,1100px); max-height:75vh; display:block; background:#000; border-radius:6px; }
  .camblock { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .camblock .ctitle { font-weight:600; margin-bottom:4px; }

  /* ---- modal / loading / toast ---- */
  #modal { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.82); padding:16px; }
  #modal .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; max-width:min(96vw,900px); }
  #modal img { max-width:100%; max-height:70vh; border-radius:6px; display:block; background:#000; }
  #modal .mbar { display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  #modal .mspin { min-height:200px; min-width:200px; display:flex; align-items:center; justify-content:center; }
  #loading { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; background:var(--bg); transition:opacity .3s; }
  #loading.gone { opacity:0; pointer-events:none; }
  .spinner { width:38px; height:38px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  #loading .lmsg { color:var(--muted); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1f242c; border:1px solid var(--line2); color:var(--fg); padding:10px 16px; border-radius:8px; z-index:120; font-size:13px; max-width:90vw; }

  /* ---- wall display (?wall=1): live only, full screen ---- */
  body.wall { background:#000; overflow:hidden; }
  body.wall header.top, body.wall .toolbar, body.wall .transport, body.wall aside.incidents,
  body.wall section.timeline, body.wall .focuspanel { display:none !important; }
  body.wall .page { max-width:none; padding:0; height:100vh; }
  body.wall .mainrow, body.wall .gridcol { height:100vh; gap:0; }
  body.wall .camgrid { height:100vh; gap:8px; grid-auto-rows:minmax(0,1fr); }
  body.wall .tile { border-radius:0; aspect-ratio:auto !important; outline:0; }
  body.wall .tile video { object-fit:cover; }
  body.wall .tile .name { top:auto; bottom:16px; left:16px; background:none; font-size:18px; text-shadow:0 1px 4px rgba(0,0,0,.8); }
  body.wall .tile .badge, body.wall .tile .ctls { display:none; }
  .wallui { display:none; }
  body.wall .wallui { display:block; }
  .wclock { position:fixed; right:18px; top:14px; text-align:right; text-shadow:0 1px 6px rgba(0,0,0,.85); z-index:5; }
  .wclock .mono { font-size:44px; font-weight:500; line-height:1; }
  .wclock div:last-child { font-size:14px; color:#cbd5e1; margin-top:4px; }
  .wrec { position:fixed; left:50%; transform:translateX(-50%); top:14px; display:flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:rgba(10,12,15,.7); font-size:13px; z-index:5; }
  .wrec::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--head); }
  .wrec.bad::before { background:var(--vehicle); }
  .wlatest { position:fixed; right:16px; bottom:14px; display:flex; align-items:center; gap:10px; padding:8px 12px 8px 8px; border-radius:10px; background:rgba(10,12,15,.78); z-index:5; }
  .wlatest img { width:72px; height:40px; object-fit:cover; border-radius:5px; display:block; }
  .wlatest b { display:block; font-size:13px; } .wlatest span { font-size:12px; color:var(--muted); }
  .wexit { position:fixed; left:16px; top:14px; z-index:5; opacity:0; transition:opacity .2s; color:#cbd5e1; background:rgba(10,12,15,.7); padding:6px 10px; border-radius:6px; text-decoration:none; font-size:12px; }
  body.wall:hover .wexit { opacity:1; }

  /* ---- phone ---- */
  @media (max-width:760px) {
    :root { --lane-label:64px; --lane-gap:8px; --lane-h:22px; }
    header.top { position:fixed; left:0; right:0; bottom:0; z-index:30; padding:6px 0 calc(10px + env(safe-area-inset-bottom)); min-height:0; border-top:1px solid var(--line); border-bottom:0; gap:0; }
    header.top .brand, .walllink, #usage { display:none; }
    nav.main { flex:1; }
    nav.main a { flex:1; flex-direction:column; gap:2px; padding:6px 0; font-size:11px; background:none !important; }
    nav.main a.on { color:#93c5fd; font-weight:600; }
    nav.main svg { display:block; }
    .page { padding:12px 12px 96px; gap:12px; }
    .toolbar { gap:8px; }
    .toolbar .seg.layout { display:none; }
    .livepill, .revpill { flex:1; height:40px; font-size:13px; }
    .filters { order:5; width:100%; overflow-x:auto; flex-wrap:nowrap; }
    .filters button { height:34px; font-size:13px; }
    /* Phone order (as in the mockup): cameras + transport, swimlanes, then incidents. */
    .mainrow { display:contents; }
    .toolbar { order:0; } .gridcol { order:1; } section.timeline { order:2; } aside.incidents { order:3; }
    .gridcol { flex-basis:100%; }
    /* Phone: always the focus arrangement — selected camera full width, others as chips. */
    .camgrid, .camgrid.focus, .camgrid.mix { grid-template-columns:repeat(auto-fit, minmax(0, 1fr)); gap:8px; }
    .camgrid .tile.sel { grid-column:1 / -1 !important; grid-row:1 !important; aspect-ratio:16/9 !important; }
    .camgrid .tile:not(.sel) { grid-column:auto !important; grid-row:2 !important; aspect-ratio:auto !important; height:58px; cursor:pointer; }
    .camgrid .tile:not(.sel) .ctls, .camgrid .tile:not(.sel) .badge, .camgrid .tile:not(.sel) .over { display:none; }
    .camgrid .tile:not(.sel) .side { display:none !important; }
    .camgrid .tile:not(.sel) .name { top:auto; bottom:4px; left:4px; font-size:11px; padding:2px 6px; }
    .transport { justify-content:space-between; padding:4px; }
    /* Reviewing: the player stays pinned at the top while the incidents below scroll. */
    body.reviewing .gridcol { position:sticky; top:0; z-index:20; background:var(--bg); margin:-12px -12px 0; padding:12px 12px 8px; box-shadow:0 6px 12px -8px rgba(0,0,0,.8); }
    /* ... and while pinned over the list, only the essentials: picture + play controls. */
    body.reviewing.scrolled .transport .right { display:none; }
    .transport .hint, .transport .syncchip, .transport .time { display:none; }
    .transport .right { margin-left:0; width:100%; justify-content:center; }
    aside.incidents { max-height:none; min-width:0; flex-basis:100%; }
    section.timeline { padding:8px 10px 6px; }
    .legend, .tl-hint, #zoomcap { display:none; }
    .lane .lab img, .lane .lab .noimg { display:none; }
    .lane .lab .nm span { display:none; }
    .lane .lab .nm b { font-size:11px; font-weight:400; color:var(--muted); }
    .tl-body { gap:4px; }
    .track .bars { inset:2px 0 3px 0; }
    .track .cov { height:2px; }
    .fp-head .acts { margin-left:0; }
    .rangehint { margin-left:0; }
  }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><span class="lmsg">Loading cameras…</span></div>
<header class="top">
  <span class="brand">homenvr</span>
  <nav class="main" aria-label="Main">

    <a href="#saved" data-tab="saved"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.2.9-4.5 4.3 1 6.2L12 17l-5.4 3 1-6.2L3 9.5l6.2-.9z"/></svg>Saved</a>
    <a href="#settings" data-tab="settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
  </nav>
  <a class="walllink" href="?wall=1">Wall display</a>

</header>

<main class="page" id="cameras">
  <div class="toolbar">
    <span class="livepill" id="livepill"><span class="d"></span>LIVE<span class="mono" id="liveclock"></span></span>
    <span class="revpill hidden" id="revpill"><span class="lbl">Reviewing</span><span class="mono" id="revtime"></span><span class="day" id="revday"></span></span>

      <button id="lay-grid" class="on">Grid · all cameras</button>
      <button id="lay-focus">Focus</button>

  <div class="mainrow">

          <button class="btn big" id="latest"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 20L9 12l10-8v16z"/><path d="M5 19V5"/></svg>Latest incident</button>

          <button class="ibtn" id="ninc" aria-label="Next incident" title="Next (newer) incident"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg></button>

        <span><i style="background:var(--person)"></i>person</span>

        <span><i style="width:2px;background:var(--head)"></i>playhead</span>

</main>

const $ = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const pad = n => String(n).padStart(2, '0');
const fmtTime = t => { const d = new Date(t * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtHM = t => { const d = new Date(t * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtDay = t => new Date(t * 1000).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const fmtDur = s => { s = Math.max(1, Math.round(s)); if (s < 60) return s + ' s'; const m = Math.floor(s / 60);
  if (m < 60) return `${m} m ${s % 60} s`; return `${Math.floor(m / 60)} h ${m % 60} m`; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), ms);
}

    });
    const rng = card.querySelector('.tuner input');
    if (rng) rng.oninput = () => { card.querySelector('.tuner .rangeval').textContent = rng.value; };
    card.querySelectorAll('.bursts button').forEach(x => x.onclick = () => { S.selCam = b.camera; layoutGrid(); reviewAt(+x.dataset.t - LEAD); showPlayer(); });
  });
}

// ---------------------------------------------------------------- render: timeline
function windowRange() {
  if (S.zoom === 'half') return [S.halfStart, S.halfStart + 1800];
  return [S.dayStart, dayEnd(S.dayStart)];
}
function ensureHalfWindow(force) {
  const t = S.mode === 'live' ? nowS() : S.playT;
  if (force || t < S.halfStart || t > S.halfStart + 1800) {
    S.halfStart = t - 1200;
    if (S.zoom === 'half') renderTimeline();
  }
}
const frac = t => { const [a, b] = windowRange(); return (t - a) / (b - a); };
const pct = f => (clamp(f, 0, 1) * 100).toFixed(3) + '%';
function renderTimeline() {
  const [w0, w1] = windowRange();
  $('#daylbl').textContent = isToday() ? 'Today' : fmtDay(S.dayStart);
  $('#dnext').disabled = isToday();
  $('#z-day').classList.toggle('on', S.zoom === 'day');
  $('#z-half').classList.toggle('on', S.zoom === 'half');
  const live = S.mode === 'live';
  $('#zoomcap').textContent = S.zoom === 'day'
    ? `24 h — bars show motion per 30 min${isToday() ? '; the right edge of the recording is live' : ''}`
    : `${fmtHM(w0)} – ${fmtHM(w1)} — every lane is a filmstrip; drag to scrub all cameras`;
  $('#tlhint').textContent = live
    ? 'Drag the playhead left (or tap any incident) to review — the grid switches to recordings. Go live returns here.'
    : 'Reviewing recordings. Drag to the end of the recorded bar, or press Go live, to return to live view.';
  // axis
  let ticks;
  if (S.zoom === 'day') ticks = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(h => [h / 24, pad(h)]);
  else ticks = [0, 0.25, 0.5, 0.75, 1].map(f => [f, fmtHM(w0 + f * 1800)]);
  $('#axis').innerHTML = ticks.map(([f, l]) => `<span style="left:${f * 100}%">${l}</span>`).join('');
  // lanes
  const busyByCam = {};
  for (const b of incItems()) if (b.kind === 'busy') (busyByCam[b.camera] = busyByCam[b.camera] || []).push(b);
  const lanes = S.tl ? S.tl.cameras : cameras.map(c => ({ id: c.id, name: c.name, counts: [], person: [], vehicle: [], coverage: [], events: [], total: 0 }));
  const now = nowS();
  const html = lanes.map(l => {
    const noisy = !!busyByCam[l.id];
    const lastEv = l.events.length ? l.events[l.events.length - 1] : null;
    let inner = '';
    if (S.zoom === 'day') {
      const max = Math.max(1, ...l.counts);
      inner += '<div class="bars">' + l.counts.map((n, i) => {
        const cls = l.person[i] ? 'person' : l.vehicle[i] ? 'vehicle' : '';
        return `<div class="${cls}" style="height:${n ? Math.max(12, Math.round(n / max * 100)) : 0}%" title="${n} events"></div>`;
      }).join('') + '</div>';
      for (const [a, b] of l.coverage) inner += `<div class="cov" style="left:${pct(frac(a))};width:${pct(frac(b) - frac(a))}"></div>`;
      for (const [ts, kind] of l.events) if (kind !== 'motion') inner += `<div class="tick ${kind}" style="left:${pct(frac(ts))}"></div>`;
    } else {
      const n = Math.max(4, Math.min(12, Math.round((($('#lanes').clientWidth || 900) - 168) / 120)));
      const slot = 1800 / n;
      inner += '<div class="strip">';
      for (let k = 0; k < n; k++) {
        const ts = w0 + (k + 0.5) * slot;
        if (ts > now - 20 || !covered(l.id, ts).ok) { inner += '<div class="gap"></div>'; continue; }
        // Prefer a saved event frame inside the slot (instant), else extract one.
        const ev = l.events.find(e => Math.abs(e[0] - ts) < slot / 2);
        inner += `<img alt="" loading="lazy" onerror="this.classList.add('broken')" src="${ev ? thumbUrl(ev[2]) : camThumb(l.id, ts)}">`;
      }
      inner += '</div>';
      for (const [ts, kind] of l.events) if (ts >= w0 && ts <= w1) inner += `<div class="mk ${kind}" style="left:${pct(frac(ts))}"></div>`;
    }
    for (const b of busyByCam[l.id] || []) if (b.end > w0 && b.start < w1) inner += `<div class="busyband" style="left:${pct(frac(b.start))};width:${pct(frac(b.end) - frac(b.start))}" title="busy period (folded)"></div>`;
    if (isToday() && now < w1) inner += `<div class="future" style="left:${pct(frac(now))}"></div>`;
    return `<div class="lane${l.id === S.selCam ? ' sel' : ''}" data-cam="${l.id}">
      <button class="lab" data-cam="${l.id}">${lastEv ? `<img alt="" src="${thumbUrl(lastEv[2])}">` : '<span class="noimg"></span>'}
        <span class="nm"><b>${esc(l.name)}</b><span class="${noisy ? 'noisy' : ''}">${l.total} events</span></span></button>
      <div class="track">${inner}</div></div>`;
  }).join('');
  $('#lanes').innerHTML = html + '<div class="tl-over" id="tlover"><div class="band hidden" id="band"></div><div class="playhead" id="playhead"><span></span></div></div>';
  $('#lanes').querySelectorAll('.lab').forEach(b => b.onclick = () => selectCam(b.dataset.cam));
  wireScrub();
  renderPlayhead();
}
function renderLanesSel() {
  document.querySelectorAll('#lanes .lane').forEach(l => l.classList.toggle('sel', l.dataset.cam === S.selCam));
}
let scrubT = null;
function renderPlayhead() {
  const ph = $('#playhead'); if (!ph) return;
  const live = S.mode === 'live';
  const t = scrubT ?? (live ? nowS() : S.playT);
  const [w0, w1] = windowRange();
  ph.style.display = t >= w0 && t <= w1 ? '' : 'none';
  ph.style.left = pct(frac(t));
  ph.querySelector('span').textContent = scrubT != null ? fmtTime(scrubT) + (scrubT > nowS() - LIVE_EDGE ? ' · live' : '') : live ? 'LIVE' : fmtTime(t);
  const band = $('#band'), ci = currentIncident();
  if (band) {
    if (ci && S.zoom === 'half' && ci.end > w0 && ci.start < w1) {
      band.classList.remove('hidden');
      band.style.left = pct(frac(ci.start - 2)); band.style.width = pct(frac(ci.end + 2) - frac(ci.start - 2));
    } else band.classList.add('hidden');
  }
}
function wireScrub() {
  const over = $('#tlover');
  let dragging = false;
  const tAt = x => { const r = over.getBoundingClientRect(); const [w0, w1] = windowRange(); return w0 + clamp((x - r.left) / r.width, 0, 1) * (w1 - w0); };
  over.addEventListener('pointerdown', e => { dragging = true; over.setPointerCapture(e.pointerId); scrubT = tAt(e.clientX); renderPlayhead(); });
  over.addEventListener('pointermove', e => { if (dragging) { scrubT = Math.min(tAt(e.clientX), nowS()); renderPlayhead(); } });
  const end = () => {
    if (!dragging) return; dragging = false;
    const T = scrubT; scrubT = null;
    if (T == null) return;
    if (T > nowS() - LIVE_EDGE) { if (S.mode !== 'live') goLive(); else renderPlayhead(); return; }
    S.selInc = null;
    if (S.mode === 'review') seekAll(T); else reviewAt(T);
  };
  over.addEventListener('pointerup', end);
  over.addEventListener('pointercancel', () => { dragging = false; scrubT = null; renderPlayhead(); });
}

// ---------------------------------------------------------------- focus panel
function updateTileSides() {
  const ci = currentIncident();
  for (const c of cameras) {
    const side = tiles[c.id].el.querySelector('.side');
    const n = ci ? (ci.counts[c.id] || 0) : 0;
    side.innerHTML = `${ci ? (n ? `${n} event${n > 1 ? 's' : ''} in this incident` : 'no motion in this window') : esc(c.name)}<b>Swap into view</b>`;
  }
}
let focusKey = '';
function renderFocus() {
  const fp = $('#focuspanel');
  const ci = S.layout === 'focus' && !isWall ? currentIncident() : null;
  fp.classList.toggle('hidden', !ci);
  if (!ci) { focusKey = ''; return; }
  const key = ci.id + '|' + (S.inc && S.inc.total_events) + '|' + JSON.stringify(thresholds);
  updateTileSides();
  if (key === focusKey) { renderFocusPlayhead(); return; }
  focusKey = key;
  const evs = ci.events;
  const w0 = ci.start - 10, w1 = ci.end + 10;
  const f = t => ((t - w0) / (w1 - w0) * 100).toFixed(2) + '%';
  const cams = ci.cameras.map(camName);
  const labelTxt = ci.labels.length ? ci.labels.join(' + ') + ' detected' : 'no person or vehicle detected';
  const idx = realIncidents().sort((a, b) => a.start - b.start).findIndex(i => i.id === ci.id);
  const ticks = [0, 0.25, 0.5, 0.75, 1].map(k => `<span style="left:${k * 100}%">${fmtTime(w0 + k * (w1 - w0))}</span>`).join('');
  let noise = '';
  if (ci.likely_noise) {
    const cam = ci.cameras[0], thr = thresholds[cam] || 4;
    const lo = Math.min(...evs.map(e => e.score)), hi = Math.max(...evs.map(e => e.score));
    const raise = Math.min(20, Math.ceil(hi + 0.5));
    noise = `<div class="noisehint"><div class="ttl">Probably not an incident</div>
      <p>${evs.length === 1 ? 'The only event is weak' : `All ${evs.length} events are weak`} (strength ${lo.toFixed(1)}${evs.length > 1 ? '–' + hi.toFixed(1) : ''} against a threshold of ${thr}), only one camera saw anything, and no person or vehicle was detected.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn warn" id="fp-raise" data-v="${raise}">Raise ${esc(camName(cam))} threshold to ${raise}</button>
      <button class="btn warn ghost" id="fp-dismiss">Mark as false alarm</button></div></div>`;
  }
  const smax = Math.max(...evs.map(e => e.score), ...ci.cameras.map(c => (thresholds[c] || 4) * 5));
  const seq = evs.map((e, k) => {
    const thr = thresholds[e.camera] || 4, gap = k ? `+${Math.round(e.ts - evs[k - 1].ts)} s` : 'start';
    const lb = (e.label || '').split(',').filter(Boolean);
    return `<button class="seqcard" data-t="${e.ts}" data-cam="${e.camera}">
      <span class="im">${lazyImg(thumbUrl(e.id))}<span class="no">${k + 1}</span></span>
      <span class="r"><span class="mono">${fmtTime(e.ts)}</span><span>${gap}</span></span>
      <span class="strength"><i style="width:${(e.score / smax * 100).toFixed(1)}%;${lb.length ? `background:var(--${lb[0]})` : ''}"></i><b style="left:${(thr / smax * 100).toFixed(1)}%"></b></span>
      <span class="cap">${esc(camName(e.camera))} · strength ${e.score.toFixed(1)}${lb.length ? ' · ' + lb.join(', ') : ''}</span></button>`;
  }).join('');
  fp.innerHTML = `
    <div class="fp-head">
      <div><h1>Incident · <span class="mono">${fmtTime(ci.start)} – ${fmtTime(ci.end)}</span></h1>
        <span class="sub">${fmtDay(ci.start)} · ${fmtDur(ci.end - ci.start + 1)} · ${evs.length} event${evs.length > 1 ? 's' : ''} · ${cams.length > 1 ? esc(ci.path) : esc(cams[0]) + ' only'} · ${labelTxt}</span></div>
      <div class="acts">
        <button class="btn" id="fp-prev" ${idx <= 0 ? 'disabled' : ''}>‹ Previous incident</button>
        <button class="btn" id="fp-next" ${idx < 0 || idx >= realIncidents().length - 1 ? 'disabled' : ''}>Next incident ›</button>
      </div>
    </div>
    <div class="fp-row">
      <div class="card fp-win"><span class="sub">Incident window with 10 s lead-in and tail — click to jump</span>
        <div class="minitl" id="minitl"><div class="incwin" style="left:${f(ci.start)};width:calc(${f(ci.end)} - ${f(ci.start)})"></div>
          ${evs.map(e => { const lb = (e.label || '').split(',').filter(Boolean)[0] || ''; return `<span class="tk ${lb}" data-t="${e.ts}" style="left:${f(e.ts)}" title="${fmtTime(e.ts)} · ${esc(camName(e.camera))}"></span>`; }).join('')}
          <div class="ph" id="minph"></div></div>
        <div class="miniaxis">${ticks}</div></div>
      ${noise}
    </div>
    <section class="card"><div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px"><h2>Sequence</h2><span class="sub">each event in order — click to jump; bar = motion strength vs. threshold</span></div>
      <div class="seq">${seq}</div></section>`;
  const mt = $('#minitl');
  mt.onclick = e => { const r = mt.getBoundingClientRect(); seekAll(w0 + clamp((e.clientX - r.left) / r.width, 0, 1) * (w1 - w0)); };
  fp.querySelectorAll('.seqcard').forEach(b => b.onclick = () => { S.selCam = b.dataset.cam; layoutGrid(); seekAll(+b.dataset.t - 2); showPlayer(); });
  const sorted = realIncidents().sort((a, b) => a.start - b.start);
  if ($('#fp-prev')) $('#fp-prev').onclick = () => { const i = sorted[idx - 1]; if (i) playIncident(i); };
  if ($('#fp-next')) $('#fp-next').onclick = () => { const i = sorted[idx + 1]; if (i) playIncident(i); };
  if ($('#fp-raise')) $('#fp-raise').onclick = async () => {
    const v = +$('#fp-raise').dataset.v, cam = ci.cameras[0];
    try { await post('api/config', { cameras: { [cam]: { motion_sensitivity: v } } });
      toast(`${camName(cam)} threshold set to ${v} — applies to new motion.`); refreshData(); } catch (e) { toast('Save failed: ' + e.message); }
  };
  if ($('#fp-dismiss')) $('#fp-dismiss').onclick = async () => {
    try { await post('api/incidents/dismiss', { event_ids: evs.map(e => e.id) });
      toast('Marked as a false alarm — hidden from incidents.'); S.selInc = null; refreshData(); } catch (e) { toast('Failed: ' + e.message); }
  };

}
function renderFocusPlayhead() {
  const ph = $('#minph'), ci = currentIncident();

  ph.style.left = (clamp((S.playT - w0) / (w1 - w0), 0, 1) * 100).toFixed(2) + '%';

function shiftDay(dir) {
  const d = new Date(S.dayStart * 1000); d.setDate(d.getDate() + dir);
  const ds = d.getTime() / 1000;
  if (ds > todayStart()) return;
  if (ds === todayStart()) { goLive(); return; }
  S.dayStart = ds; S.selInc = null;
  refreshData().then(() => {
    // Open the day at its newest incident, else at the end of its recordings.
    const i = realIncidents()[0];
    if (i) playIncident(i);
    else {
      const ends = (S.tl ? S.tl.cameras : []).flatMap(l => l.coverage.map(c => c[1]));
      if (ends.length) reviewAt(Math.max(...ends) - 60); else toast('No recordings on this day.');

}

document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea') || $('#cameras').classList.contains('hidden') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ' && S.mode === 'review') { e.preventDefault(); $('#pp').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); S.mode === 'review' ? seekAll(S.playT - 10) : reviewAt(nowS() - 10 - LIVE_EDGE); }
  else if (e.key === 'ArrowRight' && S.mode === 'review') { e.preventDefault(); seekAll(S.playT + 10); }
  else if (e.key === 'Escape' && S.mode === 'review' && !fsElement()) goLive();

// ---------------------------------------------------------------- snapshot modal
async function openSnapshot(camId, name) {
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="box"><div class="mspin"><div class="spinner"></div></div></div>`;
  m.onclick = e => { if (e.target === m) m.remove(); };

  try {
    const r = await fetch(`api/cameras/${camId}/snapshot`);
    if (!r.ok) throw new Error(r.status);
    const blobUrl = URL.createObjectURL(await r.blob());
    m.querySelector('.box').innerHTML = `<img src="${blobUrl}" alt="snapshot">
      <div class="mbar"><b style="flex:1">${esc(name)} · ${new Date().toLocaleTimeString()}</b>
        <a class="btn" href="${blobUrl}" download="${camId}-snapshot.jpg">Download</a>
        <button class="btn" id="m_push">Push to alert</button><button class="btn" id="m_close">Close</button>
        <span class="saved" id="m_msg"></span></div>`;
    m.querySelector('#m_close').onclick = () => m.remove();
    m.querySelector('#m_push').onclick = async () => {
      const msg = m.querySelector('#m_msg'); msg.textContent = 'sending…'; msg.style.color = '';
      try { const j = await post(`api/cameras/${camId}/snapshot/push`, {}); msg.textContent = '✓ pushed via ' + j.notifier; }
      catch (e) { msg.textContent = 'failed: ' + e.message; msg.style.color = 'var(--head)'; }

  } catch (e) {
    m.querySelector('.box').innerHTML = `<p class="hint">Snapshot failed (${esc(e.message)}).</p><div class="mbar"><button class="btn" id="m_close">Close</button></div>`;
    m.querySelector('#m_close').onclick = () => m.remove();
  }
}

  try { clips = await api('api/saved'); } catch { root.innerHTML = '<p class="hint">Failed to load.</p>'; return; }
  if (!clips.length) { root.innerHTML = '<div class="scard"><h3>Saved clips</h3><p class="hint">None yet. While reviewing, press <b>Keep</b> to save the incident (or 60 s). Saved clips are never auto-deleted.</p></div>'; return; }
  root.innerHTML = `<div style="display:flex;align-items:baseline;gap:8px"><h2>Saved clips (${clips.length})</h2>
    <span class="sub">Permanent — excluded from retention · ${fmtBytes(clips.reduce((a, c) => a + c.size, 0))}</span></div>
    <div class="savedgrid" id="savedlist"></div>`;
  const list = $('#savedlist');
  for (const c of clips) {
    const cam = camById(c.name.split('-')[0]);
    const n = encodeURIComponent(c.name);
    const card = document.createElement('div'); card.className = 'scard clip';
    card.innerHTML = `<button class="thumb" aria-label="Play ${esc(c.name)}">
        <img alt="" loading="lazy" src="api/saved/${n}/thumb" onerror="this.classList.add('broken')">
        <span class="play">${ICON_PLAY}</span></button>
      <div class="meta"><b>${esc(c.name)}</b>
        <span class="sub">${cam ? esc(cam.name) + ' · ' : ''}${fmtBytes(c.size)} · saved ${new Date(c.ctime * 1000).toLocaleString()}</span>
        <span class="acts"><a class="btn" href="saved/${n}" download>Download</a><button class="btn del">Delete</button></span></div>`;
    card.querySelector('.thumb').onclick = () => playSaved(c);
    card.querySelector('.del').onclick = async () => {
      if (!confirm('Delete saved clip ' + c.name + '?')) return;
      await fetch('api/saved/' + n, { method: 'DELETE' });
      renderSaved(); loadCameras();
    };
    list.appendChild(card);
  }
}
// Saved clips are the original HEVC files; play them through the H.264 transcode
// (with sound) so they work in every browser. Download keeps the original.
function playSaved(c) {
  const n = encodeURIComponent(c.name);
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div class="box"><video controls autoplay playsinline src="api/saved/${n}/play.mp4"></video>
    ${c.seekable ? '' : '<p class="hint">Preparing a seekable copy of this clip — until it\'s ready you can only seek within what has loaded.</p>'}
    <div class="mbar"><b style="flex:1;word-break:break-all">${esc(c.name)}</b>
    <a class="btn" href="saved/${n}" download>Download</a><button class="btn" id="m_close">Close</button></div></div>`;
  const close = () => { const v = m.querySelector('video'); v.pause(); v.removeAttribute('src'); v.load(); m.remove(); };
  m.onclick = e => { if (e.target === m) close(); };
  m.querySelector('#m_close').onclick = close;
  document.body.appendChild(m);
}

// ---------------------------------------------------------------- settings
const PUSH_ON_OPTS = [['person', 'A person is detected'], ['person_vehicle', 'A person or moving vehicle is detected'], ['motion', 'Any motion (every event)']];
async function renderSettings() {
  const root = $('#settings');
  root.innerHTML = '<p class="hint">Loading…</p>';
  let cfg;
  try { cfg = await api('api/config'); } catch { root.innerHTML = '<p class="hint">Failed to load settings.</p>'; return; }
  const a = cfg.settings.alerts, m = cfg.settings.motion, r = cfg.settings.retention;
  const opt = (v, cur) => `<option value="${v}"${v === cur ? ' selected' : ''}>${v}</option>`;
  root.innerHTML = `
    <div class="scard">
      <h3>Alerts</h3>
      <p class="hint">Get notified if a camera stops recording or the disk fills. Secrets show as •••; leave them to keep the stored value.</p>
      <div class="frow"><label>Notifier</label><select id="s_notifier">${cfg.notifiers.map(n => opt(n, a.notifier)).join('')}</select></div>
      <div class="frow nf nf-ntfy"><label>ntfy URL</label><input id="s_ntfy" value="${esc(a.ntfy_url)}" placeholder="https://ntfy.sh/your-topic"></div>
      <div class="frow nf nf-webhook"><label>Discord/Slack webhook</label><input id="s_webhook" value="${esc(a.webhook_url)}" placeholder="https://discord.com/api/webhooks/..."></div>
      <div class="frow nf nf-telegram"><label>Telegram bot token</label><input id="s_tg_token" value="${esc(a.telegram.bot_token)}" placeholder="123456:ABC-..."></div>
      <div class="frow nf nf-telegram"><label>Telegram chat ID</label><input id="s_tg_chat" value="${esc(a.telegram.chat_id)}" placeholder="e.g. 123456789"></div>
      <div class="frow"><label>Alert if stalled (sec)</label><input id="s_stale" type="number" min="10" value="${a.stale_segment_seconds}"></div>
      <div class="frow"><label>Push motion snapshots</label><input id="s_mpush" type="checkbox" ${a.motion_push ? 'checked' : ''}><span class="sub">send a photo notification when motion is detected</span></div>
      <div class="frow"><label>Push when</label><select id="s_pushon">${PUSH_ON_OPTS.map(([v, l]) => `<option value="${v}"${v === (a.push_on || 'person') ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="frow"><label></label><span class="sub">Every motion event is still recorded and labelled; this only filters notifications. Person/vehicle need object detection (Motion detection card) — without it every event is pushed.</span></div>
      <div class="frow"><label>Public address</label><input id="s_puburl" value="${esc(a.public_url || '')}" placeholder="https://homenvr.your-tailnet.ts.net"></div>
      <div class="frow"><label></label><span class="sub">Where this page is reachable from your phone. Motion pushes then link to the event: tapping one opens it here, at that time and camera.</span></div>
      <div class="frow"><label>Motion push cooldown (sec)</label><input id="s_mcool" type="number" min="0" value="${a.motion_push_cooldown}"><span class="sub">0 = push every detected event</span></div>
      <div class="frow"><button class="btn" id="s_save">Save alerts</button><button class="btn" id="s_test">Send test alert</button><span class="saved" id="s_amsg"></span></div>
    </div>
    <div class="scard">
      <h3>Motion detection</h3>
      <p class="hint">Marks activity on the timeline and builds incidents. ${m.enabled ? '' : '<b>Disabled</b> — enable in config.yml and restart.'} Lower sensitivity = more sensitive.</p>
      <div class="frow"><label>Sensitivity</label><input id="s_sens" type="range" min="1" max="20" step="0.5" value="${Math.min(20, Math.max(1, m.sensitivity))}"><span class="rangeval" id="s_sens_v">${m.sensitivity}</span></div>
      <div class="rangehint"><span>◀ more sensitive (smaller motion)</span><span>less ▶</span></div>
      <div class="frow"><label></label><span class="sub">Typical 2–8. Raise if a camera logs too many events; lower to catch subtle motion.</span></div>
      <div class="frow"><label>Merge gap (sec)</label><input id="s_gap" type="number" min="1" value="${m.min_gap_seconds}"><span class="sub">burst of motion within this many seconds = one event</span></div>
      <div class="frow"><label>Label person/vehicle</label><input id="s_detect" type="checkbox" ${m.detect ? 'checked' : ''}><span class="sub">on-server object detection tags each event</span></div>
      <div class="frow"><button class="btn" id="s_savem">Save motion</button><span class="saved" id="s_mmsg"></span></div>
    </div>
    <div class="scard">
      <h3>Retention</h3>
      <p class="hint">Oldest footage is deleted first. 0 = unlimited.</p>
      <div class="frow"><label>Keep days</label><input id="s_days" type="number" min="0" value="${r.max_days}"></div>
      <div class="frow"><label>Max total GB</label><input id="s_maxgb" type="number" min="0" value="${r.max_gb}"></div>
      <div class="frow"><label>Keep free GB</label><input id="s_free" type="number" min="0" value="${r.min_free_gb}"></div>
      <div class="frow"><button class="btn" id="s_saver">Save retention</button><span class="saved" id="s_rmsg"></span></div>
    </div>
    <div class="scard">
      <h3>Cameras</h3>
      <p class="hint">Per-camera tuning. Rotation applies everywhere (live, snapshots, thumbnails, playback) and syncs across devices. Motion sensitivity "global" = ${m.sensitivity}; lower = more sensitive.</p>
      <div id="camsettings"></div>
      <p class="hint" style="margin-top:12px">Image settings (brightness, night mode/IR, WDR, encoding bitrate/resolution) live on the NVR and need its HTTP/ISAPI port enabled — not available while that port is closed.</p>
    </div>`;
  const syncNotifierFields = () => {
    const n = $('#s_notifier').value;
    document.querySelectorAll('#settings .nf').forEach(el => { el.style.display = el.classList.contains('nf-' + n) ? '' : 'none'; });
  };
  $('#s_notifier').onchange = syncNotifierFields; syncNotifierFields();
  const save = async (patch, msgEl) => {
    msgEl.textContent = 'Saving…'; msgEl.style.color = '';
    try { await post('api/config', patch); msgEl.textContent = '✓ saved'; }
    catch (e) { msgEl.textContent = 'save failed (' + e.message + ')'; msgEl.style.color = 'var(--head)'; }
    setTimeout(() => { msgEl.textContent = ''; }, 4000);
  };
  $('#s_save').onclick = () => save({ alerts: {
    notifier: $('#s_notifier').value, ntfy_url: $('#s_ntfy').value, webhook_url: $('#s_webhook').value,
    telegram: { bot_token: $('#s_tg_token').value, chat_id: $('#s_tg_chat').value },
    stale_segment_seconds: +$('#s_stale').value,
    motion_push: $('#s_mpush').checked, motion_push_cooldown: +$('#s_mcool').value,
    push_on: $('#s_pushon').value, public_url: $('#s_puburl').value.trim() } }, $('#s_amsg'));
  $('#s_test').onclick = async () => {
    const el = $('#s_amsg'); el.textContent = 'sending…'; el.style.color = '';
    try { const j = await post('api/alerts/test', {}); el.textContent = j.delivered ? '✓ sent via ' + j.notifier : 'notifier is "none" — pick & save one first'; }
    catch (e) { el.textContent = 'failed: ' + e.message; el.style.color = 'var(--head)'; }
    setTimeout(() => { el.textContent = ''; }, 6000);
  };
  $('#s_sens').oninput = () => { $('#s_sens_v').textContent = $('#s_sens').value; };
  $('#s_savem').onclick = () => save({ motion: { sensitivity: +$('#s_sens').value, min_gap_seconds: +$('#s_gap').value, detect: $('#s_detect').checked } }, $('#s_mmsg'));
  $('#s_saver').onclick = () => save({ retention: { max_days: +$('#s_days').value, max_gb: +$('#s_maxgb').value, min_free_gb: +$('#s_free').value } }, $('#s_rmsg'));
  const cs = $('#camsettings');
  const gsens = Math.min(20, Math.max(1, m.sensitivity));
  for (const c of cfg.settings.cameras) {
    const b = document.createElement('div'); b.className = 'camblock';
    const rotOpts = [0, 90, 180, 270].map(d => `<option value="${d}"${c.rotation === d ? ' selected' : ''}>${d}°</option>`).join('');
    const useGlobal = !c.motion_sensitivity;
    const sensVal = useGlobal ? gsens : Math.min(20, Math.max(1, c.motion_sensitivity));
    b.innerHTML = `
      <div class="ctitle">${esc(c.name)}</div>
      <div class="frow"><label>Name</label><input class="c_name" value="${esc(c.name)}"></div>
      <div class="frow"><label>Rotation</label><select class="c_rot">${rotOpts}</select></div>
      <div class="frow"><label>Push when</label><select class="c_pushon"><option value="">Use global (${esc((PUSH_ON_OPTS.find(o => o[0] === (a.push_on || 'person')) || [, ''])[1])})</option>
        ${PUSH_ON_OPTS.map(([v, l]) => `<option value="${v}"${v === c.push_on ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
      <div class="frow"><label>Motion sensitivity</label>
        <input class="c_sens" type="range" min="1" max="20" step="0.5" value="${sensVal}" ${useGlobal ? 'disabled' : ''}>
        <span class="rangeval c_sens_v">${useGlobal ? 'global' : sensVal}</span></div>
      <div class="rangehint"><span>◀ more sensitive</span><span>less ▶</span></div>
      <div class="frow"><label></label><label class="chk"><input type="checkbox" class="c_global" ${useGlobal ? 'checked' : ''}> use global sensitivity (${gsens})</label></div>
      <div class="frow"><label></label><button class="btn c_save">Save</button><span class="saved c_msg"></span></div>`;
    const sens = b.querySelector('.c_sens'), sv = b.querySelector('.c_sens_v'), gl = b.querySelector('.c_global');
    sens.oninput = () => { sv.textContent = sens.value; };
    gl.onchange = () => { sens.disabled = gl.checked; sv.textContent = gl.checked ? 'global' : sens.value; };
    b.querySelector('.c_save').onclick = () => save({ cameras: { [c.id]: {
      name: b.querySelector('.c_name').value, rotation: +b.querySelector('.c_rot').value,
      push_on: b.querySelector('.c_pushon').value,
      motion_sensitivity: gl.checked ? 0 : +sens.value } } }, b.querySelector('.c_msg'))
      .then(() => { camRot[c.id] = +b.querySelector('.c_rot').value; const cam = camById(c.id); if (cam) cam.name = b.querySelector('.c_name').value; });
    cs.appendChild(b);
  }
}

// ---------------------------------------------------------------- tabs + boot
function tab(name) {
  for (const n of ['cameras', 'saved', 'settings']) {
    $('#' + n).classList.toggle('hidden', name !== n);
    document.querySelector(`nav.main a[data-tab="${n}"]`).classList.toggle('on', name === n);
  }
  if (name === 'cameras') {
    for (const c of cameras) { tiles[c.id].el.querySelector('.name').textContent = c.name; }
    layoutGrid(); goLive();
  } else {
    // Stop streaming while away from the cameras page.
    for (const c of cameras) { const t = tiles[c.id]; stopLive(t); t.video.removeAttribute('src'); t.video.load(); t.state = 'idle'; }
  }
  if (name === 'saved') renderSaved();
  if (name === 'settings') renderSettings();
}
// ?play=<unix time>&cam=<id> (the link in motion pushes): open review there. The query
// is dropped from the address bar so a reload goes back to live.
function openDeepLink() {
  const q = new URLSearchParams(location.search), T = +q.get('play');
  if (isWall || !q.has('play') || !(T > 0)) return;
  history.replaceState(null, '', location.pathname + location.hash);
  if (camById(q.get('cam'))) { S.selCam = q.get('cam'); layoutGrid(); applyAudio(); }
  reviewAt(T - LEAD);
}
const tabFromHash = () => (['saved', 'settings'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'cameras');
window.addEventListener('hashchange', () => tab(tabFromHash()));

(async () => {
  if (isWall) document.body.classList.add('wall');
  try {
    await loadCameras();
    S.dayStart = todayStart();
    buildGrid();
    applyAudio();
    tab(isWall ? 'cameras' : tabFromHash());
    openDeepLink();
    const l = $('#loading'); l.classList.add('gone'); setTimeout(() => l.classList.add('hidden'), 400);
    refreshData();
  } catch (e) {
    $('#loading').querySelector('.lmsg').textContent = 'Failed to load (' + e.message + '). Retrying…';
    setTimeout(() => location.reload(), 4000);
    return;
  }
  setInterval(syncTick, 250);
  setInterval(() => { if (S.mode === 'live') renderClock(); }, 1000);
  setInterval(() => { if (isToday() && !$('#cameras').classList.contains('hidden')) refreshData(); }, 20000);
  setInterval(() => loadCameras().catch(() => {}), 30000);
  addEventListener('scroll', () => document.body.classList.toggle('scrolled', scrollY > 60), { passive: true });
  let wasPhone = isPhone();
  window.addEventListener('resize', () => { if (isPhone() !== wasPhone) { wasPhone = isPhone(); layoutGrid(); renderTimeline(); } });
})();
</script>
