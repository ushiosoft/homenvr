<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homenvr</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --fg:#1b1f24; --muted:#667085; --line:#d0d5dd; --accent:#2563eb; --rec:#16a34a; --bad:#dc2626; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --panel:#181b21; --fg:#e6e8eb; --muted:#98a2b3; --line:#2c313a; --accent:#60a5fa; --rec:#4ade80; --bad:#f87171; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  nav button { background:none; border:0; color:var(--muted); font:inherit; padding:6px 10px; cursor:pointer; border-radius:6px; }
  nav button.on { color:var(--fg); background:var(--bg); }
  #usage { margin-left:auto; color:var(--muted); font-size:12px; }
  main { padding:16px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); }
  @media (max-width:480px) { .grid { grid-template-columns:1fr; } }
  .tile { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .vwrap { position:relative; overflow:hidden; aspect-ratio:16/9; background:#000; }
  .vwrap video { width:100%; height:100%; object-fit:contain; display:block; transform-origin:center center; will-change:transform; }
  .vwrap.zoomed video { cursor:grab; touch-action:none; }
  .vwrap.zoomed video:active { cursor:grabbing; }
  #playerWrap.zoomed #player { touch-action:none; }
  .ctls { position:absolute; top:6px; right:6px; display:flex; gap:4px; z-index:2; opacity:0; transition:opacity .15s; }
  .vwrap:hover .ctls { opacity:1; }
  .iconbtn { background:rgba(0,0,0,.55); color:#fff; border:0; border-radius:5px; width:30px; height:30px; font-size:14px; cursor:pointer; line-height:1; }
  .iconbtn:hover { background:rgba(0,0,0,.8); }
  .playtap { position:absolute; inset:0; margin:auto; width:140px; height:40px; background:rgba(0,0,0,.6); color:#fff; border:0; border-radius:8px; cursor:pointer; z-index:3; }
  .zhint { position:absolute; bottom:6px; left:8px; z-index:2; font-size:11px; color:#fff; background:rgba(0,0,0,.5); padding:1px 6px; border-radius:4px; opacity:0; transition:opacity .15s; }
  .vwrap:hover .zhint { opacity:.85; }
  /* Touch devices have no hover: keep controls visible and drop the mouse hint. */
  @media (hover: none) {
    .ctls { opacity:1; }
    .iconbtn { width:34px; height:34px; font-size:16px; background:rgba(0,0,0,.6); }
    .zhint { display:none; }
  }
  .tile .bar { display:flex; gap:8px; padding:6px 10px; align-items:center; font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); display:inline-block; }
  .dot.ok { background:var(--rec); }
  .err { color:var(--bad); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; text-align:right; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  select, input, button.btn { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--fg); }
  button.btn { cursor:pointer; }
  #playerWrap { position:relative; overflow:hidden; background:#000; border-radius:8px; }
  #player { width:100%; max-height:70vh; display:block; background:#000; transform-origin:center center; will-change:transform; }
  #playerWrap.zoomed #player { cursor:grab; }
  #timeline { position:relative; height:44px; background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-top:10px; cursor:pointer; user-select:none; }
  #timeline .seg { position:absolute; top:8px; bottom:16px; background:var(--accent); opacity:.55; }
  #timeline .cursor { position:absolute; top:0; bottom:0; width:2px; background:var(--bad); }
  #timeline .evt { position:absolute; top:2px; width:3px; height:11px; margin-left:-1px; background:#f59e0b; border-radius:1px; cursor:pointer; }
  #timeline .evt:hover { height:15px; background:#fbbf24; }
  #timeline .tick { position:absolute; bottom:0; font-size:10px; color:var(--muted); transform:translateX(-50%); }
  #now { color:var(--muted); font-variant-numeric:tabular-nums; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; max-width:680px; }
  .card h3 { margin:0 0 4px; font-size:14px; }
  .card p.hint { margin:0 0 12px; color:var(--muted); font-size:12px; }
  .frow { display:flex; gap:10px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .frow label { width:170px; color:var(--muted); }
  .frow input, .frow select { flex:1; min-width:140px; }
  .saved { color:var(--rec); font-size:12px; margin-left:8px; }
  #loading { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; gap:14px;
             align-items:center; justify-content:center; background:var(--bg); transition:opacity .3s; }
  #loading.gone { opacity:0; pointer-events:none; }
  .spinner { width:38px; height:38px; border:3px solid var(--line); border-top-color:var(--accent);
             border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #loading .lmsg { color:var(--muted); font-size:13px; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration:2s; } }
  .hidden { display:none; }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><span class="lmsg">Loading cameras…</span></div>
<header>
  <h1>homenvr</h1>
  <nav><button id="tab-live" class="on">Live</button><button id="tab-play">Playback</button><button id="tab-saved">Saved</button><button id="tab-settings">Settings</button></nav>
  <span id="usage"></span>
</header>
<main>
  <section id="live" class="grid"></section>
  <section id="play" class="hidden">
    <div class="controls">
      <select id="cam"></select>
      <input id="day" type="date">
      <button class="btn" id="prev">◀ day</button><button class="btn" id="next">day ▶</button>
      <button class="btn" id="prevEvt" title="previous motion">◀ motion</button><button class="btn" id="nextEvt" title="next motion">motion ▶</button>
      <span id="now"></span>
      <button class="btn" id="zinPlay" title="Zoom in">＋</button>
      <button class="btn" id="zoutPlay" title="Zoom out">－</button>
      <button class="btn" id="rotPlay" title="Rotate view">⟳ rotate</button>
      <span style="flex:1"></span>
      <label><input id="exlen" type="number" value="60" min="1" max="360" style="width:64px"> s from cursor</label>
      <button class="btn" id="export">⬇ Download</button>
      <button class="btn" id="keep" title="Save permanently (never auto-deleted)">★ Keep</button>
    </div>
    <div id="playerWrap"><video id="player" controls playsinline muted></video></div>
    <div id="timeline"></div>
  </section>
  <section id="saved" class="hidden"></section>
  <section id="settings" class="hidden"></section>
</main>
<script src="hls.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const api = p => fetch(p).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const fmtBytes = b => b > 1e12 ? (b/1e12).toFixed(2)+' TB' : (b/1e9).toFixed(1)+' GB';
const pad = n => String(n).padStart(2, '0');
const fmtTime = t => { const d = new Date(t*1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
let cameras = [], hlsPlayers = [];

function tryPlay(video) {
  // Chrome's autoplay policy blocks concurrent autoplay unless muted is set as a
  // *property* (the HTML attribute alone races). Set it, then play() with catch.
  video.muted = true;
  const p = video.play();
  if (p) p.catch(() => {
    // Autoplay still blocked: show a one-tap overlay on this tile.
    const wrap = video.closest('.vwrap, #playerWrap');
    if (wrap && !wrap.querySelector('.playtap')) {
      const b = document.createElement('button');
      b.className = 'playtap'; b.textContent = '▶ Tap to play';
      b.onclick = () => { video.muted = true; video.play(); b.remove(); };
      wrap.appendChild(b);
    }
  });
}

function attach(video, src) {
  video.muted = true;
  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
    video.addEventListener('loadedmetadata', () => tryPlay(video), { once: true });
    return null;
  }
  if (window.Hls && Hls.isSupported()) {
    const h = new Hls({ liveSyncDurationCount: 2, maxLiveSyncPlaybackRate: 1.5 });
    h.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) setTimeout(() => { h.loadSource(src); h.startLoad(); }, 3000); });
    h.on(Hls.Events.MANIFEST_PARSED, () => tryPlay(video));
    h.loadSource(src); h.attachMedia(video); return h;
  }
  return null;
}

async function loadCameras() {
  cameras = await api('api/cameras');
  const st = await api('api/status');
  const r = st.retention, s = st.storage;
  const grace = s.grace_bytes ? ` · ${fmtBytes(s.grace_bytes)} grace` : '';
  const saved = s.saved_bytes ? ` · ${fmtBytes(s.saved_bytes)} saved` : '';
  $('#usage').textContent = `${fmtBytes(s.recordings_bytes)} recorded${grace}${saved} · ${fmtBytes(s.disk_free_bytes)} free · keep ${r.max_days || '∞'} d / ${r.max_gb || '∞'} GB`;
}

// ---- rotate / zoom / pan transform engine (mouse + touch) ----
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function getRot(id) { try { return +localStorage.getItem('rot.' + id) || 0; } catch { return 0; } }
function saveRot(id, deg) { try { localStorage.setItem('rot.' + id, deg); } catch {} }

// When rotated 90/270, scale the video down so the upright (portrait) image fits
// inside the SAME 16:9 tile, pillarboxed — keeps the grid uniform (no giant tiles).
// The fit factor is the container's height/width (9/16 for a 16:9 tile).
function rotFit(video) {
  const x = video._xf, wrap = video.closest('.vwrap, #playerWrap');
  if (!x || x.rot % 180 === 0 || !wrap || !wrap.clientWidth) return 1;
  return wrap.clientHeight / wrap.clientWidth;
}
function applyXform(video) {
  const x = video._xf || (video._xf = { zoom: 1, px: 0, py: 0, rot: 0 });
  const wrap = video.closest('.vwrap, #playerWrap');
  if (wrap) wrap.classList.toggle('zoomed', x.zoom > 1);
  const s = x.zoom * rotFit(video);
  video.style.transform = `translate(${x.px}px, ${x.py}px) scale(${s}) rotate(${x.rot}deg)`;
}
function zoomBy(video, factor) {
  const x = video._xf, prev = x.zoom;
  x.zoom = clamp(x.zoom * factor, 1, 6);
  if (x.zoom === 1) { x.px = 0; x.py = 0; }
  else { const k = x.zoom / prev; x.px *= k; x.py *= k; }
  applyXform(video);
}
function makeInteractive(video, id) {
  const x = video._xf = { zoom: 1, px: 0, py: 0, rot: id ? getRot(id) : 0 };
  applyXform(video);
  const wrap = video.closest('.vwrap, #playerWrap');
  if (wrap && window.ResizeObserver) new ResizeObserver(() => applyXform(video)).observe(wrap);
  // Mouse wheel zoom (desktop)
  video.addEventListener('wheel', e => { e.preventDefault(); zoomBy(video, e.deltaY < 0 ? 1.2 : 1 / 1.2); }, { passive: false });
  // Pointer drag to pan (zoomed) + two-finger pinch zoom (touch)
  const pts = new Map();
  let drag = null, pinch = null;
  video.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, e);
    video.setPointerCapture(e.pointerId);
    if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), zoom: x.zoom };
      drag = null;
    } else if (x.zoom > 1) {
      drag = { sx: e.clientX, sy: e.clientY, px: x.px, py: x.py };
    }
  });
  video.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, e);
    if (pinch && pts.size === 2) {
      e.preventDefault();
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      x.zoom = clamp(pinch.zoom * (d / pinch.d), 1, 6);
      if (x.zoom === 1) { x.px = 0; x.py = 0; }
      applyXform(video);
    } else if (drag) {
      e.preventDefault();
      x.px = drag.px + (e.clientX - drag.sx); x.py = drag.py + (e.clientY - drag.sy);
      applyXform(video);
    }
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (pts.size === 0) drag = null; };
  video.addEventListener('pointerup', up);
  video.addEventListener('pointercancel', up);
  return x;
}
function rotate(video, id) {
  const x = video._xf; x.rot = (x.rot + 90) % 360;
  x.zoom = 1; x.px = 0; x.py = 0;              // reset zoom on rotate
  if (id) saveRot(id, x.rot);
  applyXform(video);
}

function renderLive() {
  hlsPlayers.forEach(h => h && h.destroy()); hlsPlayers = [];
  const root = $('#live'); root.innerHTML = '';
  for (const c of cameras) {
    const t = document.createElement('div'); t.className = 'tile';
    t.innerHTML = `<div class="vwrap"><video muted autoplay playsinline></video>
      <div class="ctls">
        <button class="iconbtn zin" title="Zoom in">+</button>
        <button class="iconbtn zout" title="Zoom out">−</button>
        <button class="iconbtn rot" title="Rotate">⟳</button>
        <button class="iconbtn fs" title="Fullscreen">⛶</button></div>
      <span class="zhint">scroll to zoom · drag to pan</span></div>
      <div class="bar"><span class="dot"></span><b></b><span class="err"></span></div>`;
    t.querySelector('b').textContent = c.name;
    const v = t.querySelector('video');
    makeInteractive(v, c.id);
    t.querySelector('.zin').onclick = () => zoomBy(v, 1.4);
    t.querySelector('.zout').onclick = () => zoomBy(v, 1 / 1.4);
    t.querySelector('.rot').onclick = () => rotate(v, c.id);
    t.querySelector('.fs').onclick = () => (t.querySelector('.vwrap').requestFullscreen?.());
    v.ondblclick = () => t.querySelector('.vwrap').requestFullscreen?.();
    root.appendChild(t);
    hlsPlayers.push(attach(v, c.live));
  }
  updateStatus();
}

function updateStatus() {
  document.querySelectorAll('#live .tile').forEach((t, i) => {
    const s = cameras[i]?.status?.record || {};
    t.querySelector('.dot').classList.toggle('ok', !!s.running);
    t.querySelector('.dot').title = s.running ? 'recording' : 'not recording';
    t.querySelector('.err').textContent = s.running ? (s.stream ? `${s.stream.video} ${s.stream.width}×${s.stream.height}` : '') : (s.last_error || 'starting…');
  });
}

// ---- playback ----
let segs = [], events = [], dayStart = 0, current = null;
const DAY = 86400;

function setDay(d) { // d: Date at local midnight
  dayStart = d.getTime() / 1000;
  $('#day').value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  loadDay();
}
async function loadDay() {
  const cam = $('#cam').value;
  segs = await api(`api/cameras/${cam}/segments?start=${dayStart}&end=${dayStart + DAY}`);
  try { events = await api(`api/cameras/${cam}/events?start=${dayStart}&end=${dayStart + DAY}`); }
  catch { events = []; }
  drawTimeline();
}
function drawTimeline() {
  const tl = $('#timeline'); tl.innerHTML = '';
  for (let h = 0; h <= 24; h += 3) {
    const k = document.createElement('div'); k.className = 'tick'; k.style.left = (h/24*100) + '%'; k.textContent = pad(h)+':00'; tl.appendChild(k);
  }
  for (const s of segs) {
    const el = document.createElement('div'); el.className = 'seg';
    const a = Math.max(s.start, dayStart), b = Math.min(s.end, dayStart + DAY);
    el.style.left = ((a - dayStart)/DAY*100) + '%'; el.style.width = Math.max(0.1, (b - a)/DAY*100) + '%';
    tl.appendChild(el);
  }
  for (const e of events) {
    const m = document.createElement('div'); m.className = 'evt';
    m.style.left = ((e.ts - dayStart)/DAY*100) + '%';
    m.title = `motion ${fmtTime(e.ts)}`;
    m.onclick = ev => { ev.stopPropagation(); playAt(e.ts); };
    tl.appendChild(m);
  }
  const c = document.createElement('div'); c.className = 'cursor'; c.id = 'cursor'; tl.appendChild(c);
  moveCursor();
}
function jumpEvent(dir) {
  if (!events.length) return;
  const t = playheadTime() || dayStart;
  const next = dir > 0 ? events.find(e => e.ts > t + 1) : [...events].reverse().find(e => e.ts < t - 1);
  if (next) playAt(next.ts);
}
function playheadTime() { return current ? current.start + $('#player').currentTime : null; }
function moveCursor() {
  const t = playheadTime(), c = $('#cursor');
  if (!c) return;
  c.style.display = t ? '' : 'none';
  if (t) { c.style.left = ((t - dayStart)/DAY*100) + '%'; $('#now').textContent = new Date(t*1000).toLocaleString(); }
}
function playAt(t) {
  let s = segs.find(x => t >= x.start && t < x.end) || segs.find(x => x.start >= t);
  if (!s) return;
  const v = $('#player');
  const offset = Math.max(0, t - s.start);
  if (current?.name !== s.name) { current = s; v.src = s.url; v.addEventListener('loadedmetadata', () => { v.currentTime = offset; v.play(); }, { once: true }); }
  else { v.currentTime = offset; v.play(); }
}
$('#player').addEventListener('timeupdate', moveCursor);
$('#player').addEventListener('ended', () => { // continue into the next segment
  const i = segs.findIndex(x => x.name === current?.name);
  if (i >= 0 && segs[i+1]) playAt(segs[i+1].start);
});
makeInteractive($('#player'));
function applyPlayerRotation() {
  const v = $('#player'); v._xf.rot = getRot($('#cam').value); v._xf.zoom = 1; v._xf.px = 0; v._xf.py = 0; applyXform(v);
}
$('#rotPlay').onclick = () => rotate($('#player'), $('#cam').value);
$('#zinPlay').onclick = () => zoomBy($('#player'), 1.4);
$('#zoutPlay').onclick = () => zoomBy($('#player'), 1 / 1.4);
$('#timeline').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  playAt(dayStart + (e.clientX - r.left) / r.width * DAY);
});
$('#cam').onchange = () => { current = null; applyPlayerRotation(); loadDay(); };
$('#day').onchange = e => { const [y,m,d] = e.target.value.split('-').map(Number); setDay(new Date(y, m-1, d)); };
$('#prev').onclick = () => { const d = new Date(dayStart*1000); d.setDate(d.getDate()-1); setDay(d); };
$('#next').onclick = () => { const d = new Date(dayStart*1000); d.setDate(d.getDate()+1); setDay(d); };
$('#prevEvt').onclick = () => jumpEvent(-1);
$('#nextEvt').onclick = () => jumpEvent(1);
$('#export').onclick = () => {
  const t = playheadTime(); if (!t) return alert('Click the timeline to pick a start point first.');
  location.href = `api/cameras/${$('#cam').value}/export?start=${t}&end=${t + Number($('#exlen').value || 60)}`;
};
$('#keep').onclick = async () => {
  const t = playheadTime(); if (!t) return alert('Click the timeline (or jump to a motion event) to pick a start point first.');
  const name = prompt('Name this saved clip (optional):', '');
  if (name === null) return;
  const len = Number($('#exlen').value || 60);
  const btn = $('#keep'); btn.disabled = true; btn.textContent = '★ Saving…';
  try {
    const r = await fetch(`api/cameras/${$('#cam').value}/save`, { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ start: t, end: t + len, name }) });
    if (!r.ok) throw new Error((await r.text()).slice(0, 120));
    const j = await r.json();
    btn.textContent = '★ Saved ✓';
    loadCameras();  // refresh storage breakdown
  } catch (e) { alert('Save failed: ' + e.message); }
  finally { setTimeout(() => { btn.disabled = false; btn.textContent = '★ Keep'; }, 2500); }
};

async function renderSaved() {
  const root = $('#saved');
  root.innerHTML = '<p class="hint">Loading…</p>';
  let clips;
  try { clips = await api('api/saved'); } catch { root.innerHTML = '<p class="hint">Failed to load.</p>'; return; }
  if (!clips.length) { root.innerHTML = '<div class="card"><h3>Saved clips</h3><p class="hint">None yet. In Playback, pick a point (or jump to a motion event) and press <b>★ Keep</b>. Saved clips are never auto-deleted.</p></div>'; return; }
  root.innerHTML = `<div class="card"><h3>Saved clips (${clips.length})</h3>
    <p class="hint">Permanent — excluded from retention. Total ${fmtBytes(clips.reduce((a, c) => a + c.size, 0))}.</p>
    <div id="savedlist"></div></div>`;
  const list = $('#savedlist');
  for (const c of clips) {
    const row = document.createElement('div'); row.className = 'frow';
    row.innerHTML = `<b style="flex:1;min-width:200px">${esc(c.name)}</b>
      <span class="hint">${fmtBytes(c.size)} · ${new Date(c.ctime * 1000).toLocaleString()}</span>
      <a class="btn" href="saved/${encodeURIComponent(c.name)}" target="_blank">▶ Open</a>
      <a class="btn" href="saved/${encodeURIComponent(c.name)}" download>⬇</a>
      <button class="btn del">🗑</button>`;
    row.querySelector('.del').onclick = async () => {
      if (!confirm('Delete saved clip ' + c.name + '?')) return;
      await fetch('api/saved/' + encodeURIComponent(c.name), { method: 'DELETE' });
      renderSaved(); loadCameras();
    };
    list.appendChild(row);
  }
}

function tab(name) {
  for (const n of ['live', 'play', 'saved', 'settings']) {
    $('#tab-' + n).classList.toggle('on', name === n);
    $('#' + n).classList.toggle('hidden', name !== n);
  }
  if (name === 'live') renderLive();
  else { hlsPlayers.forEach(h => h && h.destroy()); hlsPlayers = []; document.querySelectorAll('#live video').forEach(v => v.removeAttribute('src')); }
  if (name === 'play') { if (!dayStart) { const d = new Date(); d.setHours(0,0,0,0); setDay(d); } applyPlayerRotation(); }
  if (name === 'saved') renderSaved();
  if (name === 'settings') renderSettings();
}
$('#tab-live').onclick = () => tab('live');
$('#tab-play').onclick = () => tab('play');
$('#tab-saved').onclick = () => tab('saved');
$('#tab-settings').onclick = () => tab('settings');

// ---- settings page ----
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function renderSettings() {
  const root = $('#settings');
  root.innerHTML = '<p class="hint">Loading…</p>';
  let cfg;
  try { cfg = await api('api/config'); } catch { root.innerHTML = '<p class="hint">Failed to load settings.</p>'; return; }
  const a = cfg.settings.alerts, m = cfg.settings.motion, r = cfg.settings.retention;
  const opt = (v, cur) => `<option value="${v}"${v === cur ? ' selected' : ''}>${v}</option>`;
  root.innerHTML = `
    <div class="card">
      <h3>Alerts</h3>
      <p class="hint">Get notified if a camera stops recording or the disk fills. Secrets show as ${'•••'}; leave them to keep the stored value.</p>
      <div class="frow"><label>Notifier</label><select id="s_notifier">${cfg.notifiers.map(n => opt(n, a.notifier)).join('')}</select></div>
      <div class="frow nf nf-ntfy"><label>ntfy URL</label><input id="s_ntfy" value="${esc(a.ntfy_url)}" placeholder="https://ntfy.sh/your-topic"></div>
      <div class="frow nf nf-webhook"><label>Discord/Slack webhook</label><input id="s_webhook" value="${esc(a.webhook_url)}" placeholder="https://discord.com/api/webhooks/..."></div>
      <div class="frow nf nf-telegram"><label>Telegram bot token</label><input id="s_tg_token" value="${esc(a.telegram.bot_token)}" placeholder="123456:ABC-..."></div>
      <div class="frow nf nf-telegram"><label>Telegram chat ID</label><input id="s_tg_chat" value="${esc(a.telegram.chat_id)}" placeholder="e.g. 123456789"></div>
      <div class="frow"><label>Alert if stalled (sec)</label><input id="s_stale" type="number" min="10" value="${a.stale_segment_seconds}"></div>
      <div class="frow"><label>Push motion snapshots</label><input id="s_mpush" type="checkbox" ${a.motion_push ? 'checked' : ''} style="flex:0;width:auto"><span class="hint">send a photo notification when motion is detected</span></div>
      <div class="frow"><label>Motion push cooldown (sec)</label><input id="s_mcool" type="number" min="10" value="${a.motion_push_cooldown}"></div>
      <div class="frow"><button class="btn" id="s_save">Save alerts</button><button class="btn" id="s_test">Send test alert</button><span class="saved" id="s_amsg"></span></div>
    </div>
    <div class="card">
      <h3>Motion detection</h3>
      <p class="hint">Marks activity on the playback timeline. ${m.enabled ? '' : '<b>Disabled</b> — enable in config.yml and restart.'} Sensitivity is lower = more sensitive.</p>
      <div class="frow"><label>Sensitivity</label><input id="s_sens" type="number" step="0.5" min="0.1" value="${m.sensitivity}"></div>
      <div class="frow"><label>Merge gap (sec)</label><input id="s_gap" type="number" min="1" value="${m.min_gap_seconds}"></div>
      <div class="frow"><button class="btn" id="s_savem">Save motion</button><span class="saved" id="s_mmsg"></span></div>
    </div>
    <div class="card">
      <h3>Retention</h3>
      <p class="hint">Oldest footage is deleted first. 0 = unlimited.</p>
      <div class="frow"><label>Keep days</label><input id="s_days" type="number" min="0" value="${r.max_days}"></div>
      <div class="frow"><label>Max total GB</label><input id="s_maxgb" type="number" min="0" value="${r.max_gb}"></div>
      <div class="frow"><label>Keep free GB</label><input id="s_free" type="number" min="0" value="${r.min_free_gb}"></div>
      <div class="frow"><button class="btn" id="s_saver">Save retention</button><span class="saved" id="s_rmsg"></span></div>
    </div>`;
  const syncNotifierFields = () => {
    const n = $('#s_notifier').value;
    document.querySelectorAll('#settings .nf').forEach(el => {
      el.style.display = el.classList.contains('nf-' + n) ? '' : 'none';
    });
  };
  $('#s_notifier').onchange = syncNotifierFields; syncNotifierFields();

  const save = async (patch, msgEl) => {
    msgEl.textContent = 'Saving…'; msgEl.style.color = '';
    try { await fetch('api/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) })
            .then(r => { if (!r.ok) throw new Error(r.status); }); msgEl.textContent = '✓ saved'; }
    catch (e) { msgEl.textContent = 'save failed (' + e.message + ')'; msgEl.style.color = 'var(--bad)'; }
    setTimeout(() => { msgEl.textContent = ''; }, 4000);
  };
  $('#s_save').onclick = () => save({ alerts: {
    notifier: $('#s_notifier').value, ntfy_url: $('#s_ntfy').value, webhook_url: $('#s_webhook').value,
    telegram: { bot_token: $('#s_tg_token').value, chat_id: $('#s_tg_chat').value },
    stale_segment_seconds: +$('#s_stale').value,
    motion_push: $('#s_mpush').checked, motion_push_cooldown: +$('#s_mcool').value } }, $('#s_amsg'));
  $('#s_test').onclick = async () => {
    const el = $('#s_amsg'); el.textContent = 'sending…'; el.style.color = '';
    try { const r = await fetch('api/alerts/test', { method: 'POST' }); const j = await r.json();
      if (!r.ok) throw new Error((await r.text()).slice(0, 120));
      el.textContent = j.delivered ? '✓ sent via ' + j.notifier : 'notifier is "none" — pick & save one first';
    } catch (e) { el.textContent = 'failed: ' + e.message; el.style.color = 'var(--bad)'; }
    setTimeout(() => { el.textContent = ''; }, 6000);
  };
  $('#s_savem').onclick = () => save({ motion: { sensitivity: +$('#s_sens').value, min_gap_seconds: +$('#s_gap').value } }, $('#s_mmsg'));
  $('#s_saver').onclick = () => save({ retention: { max_days: +$('#s_days').value, max_gb: +$('#s_maxgb').value, min_free_gb: +$('#s_free').value } }, $('#s_rmsg'));
}

(async () => {
  try {
    await loadCameras();
    $('#cam').innerHTML = cameras.map(c => `<option value="${c.id}">${c.name.replace(/</g,'&lt;')}</option>`).join('');
    tab('live');
    const l = $('#loading'); l.classList.add('gone'); setTimeout(() => l.classList.add('hidden'), 400);
  } catch (e) {
    $('#loading').querySelector('.lmsg').textContent = 'Failed to load (' + e.message + '). Retrying…';
    setTimeout(() => location.reload(), 4000);
    return;
  }
  setInterval(async () => { if (!$('#live').classList.contains('hidden')) { await loadCameras(); updateStatus(); } }, 10000);
})();
</script>
</body>
</html>
